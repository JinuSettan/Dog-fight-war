<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1118" />
<title>Dog Fight War</title>
<style>
  :root { --bg:#0b1118; --panel:rgba(12,20,30,.82); --line:rgba(140,200,255,.18); --txt:#e8f2ff; --dim:#8fa6bf; --acc:#4cc2ff; --acc2:#ff6a4a; --ok:#7dffa0; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--txt); font:14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  canvas { position:fixed; inset:0; display:block; }
  #hud { pointer-events:auto; }
  .hidden { display:none !important; }

  /* ---------- lobby ---------- */
  #lobby { position:fixed; inset:0; display:flex; pointer-events:none; }
  #lobby .side { pointer-events:auto; width:min(560px, 100vw); max-height:100%; display:flex; flex-direction:column; background:linear-gradient(90deg, rgba(6,10,16,.92), rgba(6,10,16,.55)); backdrop-filter: blur(6px); border-right:1px solid var(--line); padding:max(14px, env(safe-area-inset-top)) 16px 12px max(16px, env(safe-area-inset-left)); }
  .brand { display:flex; align-items:baseline; gap:10px; margin-bottom:8px; }
  .brand h1 { margin:0; font-size:24px; letter-spacing:.14em; font-weight:800; }
  .brand h1 b { color:var(--acc2); }
  .brand small { color:var(--dim); }
  .tabs { display:flex; gap:4px; margin:6px 0 10px; flex-wrap:wrap; }
  .tab { padding:7px 12px; border:1px solid var(--line); border-radius:8px; background:rgba(255,255,255,.04); color:var(--dim); cursor:pointer; font-weight:600; font-size:13px; }
  .tab.on { color:#06121c; background:var(--acc); border-color:var(--acc); }
  .pane { overflow:auto; padding-right:4px; flex:1; min-height:0; -webkit-overflow-scrolling:touch; touch-action:pan-y; }
  .card { border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px; background:var(--panel); cursor:pointer; transition:.12s; }
  .card:hover { border-color:rgba(140,200,255,.5); }
  .card.on { border-color:var(--acc); box-shadow:0 0 0 1px var(--acc) inset, 0 0 24px rgba(76,194,255,.15); }
  .card h3 { margin:0 0 2px; font-size:15px; display:flex; justify-content:space-between; gap:8px; }
  .card p { margin:0 0 6px; color:var(--dim); font-size:12.5px; }
  .stats { display:grid; grid-template-columns: 78px 1fr; gap:3px 8px; align-items:center; font-size:11.5px; color:var(--dim); }
  .bar { height:5px; background:rgba(255,255,255,.1); border-radius:3px; overflow:hidden; } .bar i { display:block; height:100%; background:linear-gradient(90deg,var(--acc),#8affc1); }
  .row { display:flex; gap:8px; align-items:center; margin:8px 0; flex-wrap:wrap; }
  .row > label { min-width:104px; color:var(--dim); font-size:12.5px; }
  .seg { display:flex; gap:4px; flex-wrap:wrap; }
  .seg button, .btn { background:rgba(255,255,255,.06); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:7px 11px; font:inherit; font-weight:600; cursor:pointer; }
  .seg button.on { background:var(--acc); color:#04121c; border-color:var(--acc); }
  input[type=text], input[type=search], input[type=password], select { background:rgba(0,0,0,.35); color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font:inherit; width:100%; user-select:text; -webkit-user-select:text; }
  input[type=range] { width:100%; accent-color:var(--acc); }
  .val { min-width:48px; text-align:right; color:var(--acc); font-variant-numeric:tabular-nums; }
  .note { color:var(--dim); font-size:12px; margin:6px 0; }
  .status { display:inline-flex; gap:6px; align-items:center; padding:4px 9px; border-radius:99px; font-size:12px; font-weight:700; background:rgba(255,255,255,.08); }
  .status i { width:8px; height:8px; border-radius:50%; background:#888; } .status.ok i { background:var(--ok); } .status.err i { background:var(--acc2); } .status.load i { background:#ffc04a; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  .fly { pointer-events:auto; position:fixed; right:max(18px, env(safe-area-inset-right)); bottom:max(18px, env(safe-area-inset-bottom)); }
  .fly button { font-size:20px; font-weight:900; letter-spacing:.12em; padding:16px 38px; border:0; border-radius:14px; color:#fff; background:linear-gradient(180deg,#ff7a4a,#e0442a); box-shadow:0 8px 30px rgba(255,90,50,.45); cursor:pointer; }
  .fly button:active { transform:translateY(1px); }
  .keys { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:12.5px; } .keys b { color:var(--acc); font-weight:700; white-space:nowrap; }
  .apt { display:flex; justify-content:space-between; gap:10px; } .apt span { color:var(--dim); font-size:12px; }

  .cat { display:flex; gap:6px; margin:2px 0 4px; }
  .cat button { flex:1; padding:9px 8px; border-radius:10px; border:1px solid var(--line); background:rgba(255,255,255,.05); color:var(--dim); font:inherit; font-weight:800; letter-spacing:.04em; cursor:pointer; }
  .cat button.on { background:linear-gradient(180deg,#ff7a4a,#e0442a); color:#fff; border-color:#ff7a4a; }
  .cat button[data-cat=airline].on { background:linear-gradient(180deg,#4cc2ff,#2a8fd6); border-color:#4cc2ff; color:#04121c; }
  .cinebar { position:fixed; left:0; right:0; height:11vh; background:#000; z-index:7; pointer-events:none; }
  #cineTop { top:0; } #cineBot { bottom:0; }

  /* ---------- overlays ---------- */
  .overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(4,8,14,.62); backdrop-filter:blur(4px); z-index:20; }
  .modal { background:rgba(10,18,28,.95); border:1px solid var(--line); border-radius:16px; padding:22px 26px; min-width:min(420px, 92vw); max-width:92vw; text-align:center; max-height:92vh; overflow:auto; }
  .modal h2 { margin:0 0 6px; letter-spacing:.1em; } .modal .big { font-size:42px; font-weight:900; color:var(--acc); margin:4px 0; }
  .modal .grid { display:grid; grid-template-columns:1fr auto; gap:4px 18px; text-align:left; margin:10px 0 14px; color:var(--dim); } .modal .grid b { color:var(--txt); text-align:right; }
  .modal .btns { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; } .btn.pri { background:var(--acc); color:#04121c; border-color:var(--acc); }
  .loadbar { height:8px; background:rgba(255,255,255,.12); border-radius:5px; overflow:hidden; margin:12px 0 6px; } .loadbar i { display:block; height:100%; width:5%; background:linear-gradient(90deg,var(--acc),#8affc1); transition:width .25s; }
  #whiteout { position:fixed; inset:0; background:#eef3f8; opacity:0; pointer-events:none; z-index:5; }
  #credit { position:fixed; left:8px; bottom:4px; font-size:10.5px; color:rgba(255,255,255,.7); text-shadow:0 1px 2px #000; pointer-events:none; z-index:6; max-width:70vw; }
  #boot { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; background:var(--bg); z-index:50; gap:10px; }

  /* ---------- touch controls ---------- */
  #touch { position:fixed; inset:0; pointer-events:none; z-index:8; }
  #stickZone { position:absolute; left:0; bottom:0; width:46%; height:62%; pointer-events:auto; touch-action:none; }
  #stickBase { position:fixed; width:124px; height:124px; margin:-62px 0 0 -62px; border-radius:50%; border:2px solid rgba(255,255,255,.35); background:rgba(255,255,255,.07); display:none; pointer-events:none; }
  #stickKnob { position:fixed; width:56px; height:56px; margin:-28px 0 0 -28px; border-radius:50%; background:rgba(255,255,255,.35); border:2px solid rgba(255,255,255,.7); left:-99px; top:0; pointer-events:none; }
  #stickHint { position:absolute; left:6%; bottom:16%; color:rgba(255,255,255,.35); font-size:12px; letter-spacing:.2em; pointer-events:none; }
  #thrSlider { position:absolute; right:max(14px, env(safe-area-inset-right)); bottom:18%; width:46px; height:42%; border-radius:12px; background:rgba(255,255,255,.1); border:2px solid rgba(255,255,255,.35); pointer-events:auto; touch-action:none; overflow:hidden; }
  #thrFill { position:absolute; left:0; right:0; bottom:0; height:0%; background:linear-gradient(0deg,#4cc2ff,#ffd04a 85%,#ff6a4a); opacity:.75; }
  #thrLabel { position:absolute; right:max(14px, env(safe-area-inset-right)); bottom:calc(18% + 42% + 6px); width:46px; text-align:center; font-size:11px; color:rgba(255,255,255,.7); letter-spacing:.1em; }
  .tb { position:absolute; pointer-events:auto; touch-action:none; border-radius:50%; width:62px; height:62px; border:2px solid rgba(255,255,255,.4); background:rgba(255,255,255,.1); color:#fff; font-weight:800; font-size:11px; display:flex; align-items:center; justify-content:center; letter-spacing:.04em; }
  .tb.on { background:rgba(255,255,255,.4); }
  #bFire { right:calc(max(14px, env(safe-area-inset-right)) + 70px); bottom:7%; width:84px; height:84px; background:rgba(255,80,50,.35); border-color:rgba(255,120,90,.8); font-size:13px; }
  #bMsl { right:calc(max(14px, env(safe-area-inset-right)) + 164px); bottom:12%; background:rgba(255,190,60,.25); }
  #bFlare { right:calc(max(14px, env(safe-area-inset-right)) + 164px); bottom:calc(12% + 70px); background:rgba(255,190,60,.15); }
  #bGear { left:14px; top:34%; width:52px; height:52px; } #bFlaps { left:14px; top:calc(34% + 58px); width:52px; height:52px; } #bBrake { left:14px; top:calc(34% + 116px); width:52px; height:52px; }
  #bCam { right:14px; top:44%; width:48px; height:48px; font-size:10px; } #bMenu { right:14px; top:calc(44% + 54px); width:48px; height:48px; }
  #bCine { left:76px; top:34%; width:52px; height:52px; font-size:20px; } #bAuto { left:76px; top:calc(34% + 58px); width:52px; height:52px; font-size:11px; background:rgba(76,194,255,.3); border-color:rgba(76,194,255,.8); }
  @media (max-height: 520px) { .tb { width:52px; height:52px; } #bFire { width:70px; height:70px; } .brand h1 { font-size:18px; } }
  @media (max-width: 760px) { #lobby .side { width:100vw; background:rgba(6,10,16,.84); } .fly { bottom:12px; right:12px; } .fly button { padding:13px 26px; font-size:17px; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="whiteout"></div>
<div id="credit"></div>
<div id="cineBars" class="hidden"><div class="cinebar" id="cineTop"></div><div class="cinebar" id="cineBot"></div></div>

<div id="lobby" class="hidden">
  <div class="side">
    <div class="brand"><h1>DOG<b>FIGHT</b> WAR</h1><small id="brandSub">real-world jet combat</small></div>
    <div class="cat" id="cat"><button data-cat="war">⚔ WAR · fighter jets</button><button data-cat="airline">✈ AIRLINE · passengers</button></div>
    <div class="tabs" id="tabs"></div>
    <div class="pane" id="pane"></div>
  </div>
  <div class="fly"><button id="flyBtn">FLY</button></div>
</div>

<div id="touch" class="hidden">
  <div id="stickZone"><div id="stickHint">PITCH / ROLL</div></div>
  <div id="stickBase"></div><div id="stickKnob"></div>
  <div id="thrLabel">THR</div><div id="thrSlider"><div id="thrFill"></div></div>
  <div class="tb" id="bFire">FIRE</div><div class="tb" id="bMsl">MSL</div><div class="tb" id="bFlare">FLR</div>
  <div class="tb" id="bGear">GEAR</div><div class="tb" id="bFlaps">FLAP</div><div class="tb" id="bBrake">BRK</div>
  <div class="tb" id="bCam">CAM</div><div class="tb" id="bMenu">❚❚</div>
  <div class="tb" id="bCine">🎬</div><div class="tb" id="bAuto">✈ AP</div>
</div>

<div id="loading" class="overlay hidden"><div class="modal"><h2 id="loadTitle">Loading</h2><div class="note" id="loadNote">Streaming 3D map tiles…</div><div class="loadbar"><i id="loadBar"></i></div><div class="note" id="loadSub"></div></div></div>
<div id="pause" class="overlay hidden"><div class="modal"><h2>PAUSED</h2><div class="btns"><button class="btn pri" id="pResume">Resume</button><button class="btn" id="pRestart">Restart</button><button class="btn" id="pLobby">Lobby</button></div></div></div>
<div id="debrief" class="overlay hidden"><div class="modal"><h2 id="dbTitle"></h2><div class="big" id="dbBig"></div><div class="note" id="dbSub"></div><div class="grid" id="dbGrid"></div><div class="btns"><button class="btn pri" id="dRetry">Fly again</button><button class="btn" id="dLobby">Lobby</button></div></div></div>
<div id="boot"><div style="font-size:22px;letter-spacing:.2em;font-weight:800">DOG<span style="color:#ff6a4a">FIGHT</span> WAR</div><div class="note" id="bootNote">Starting…</div></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
